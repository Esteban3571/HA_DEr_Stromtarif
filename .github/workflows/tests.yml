name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node --check custom_components/stromtarif/www/stromtarif-card.js
      - run: node tests/test_card.cjs
      - run: node --check custom_components/stromtarif/www/stromtarif-panel.js
      - run: node tests/test_panel.cjs

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [homeassistant, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stromtarif-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json,re; v=json.load(open('custom_components/stromtarif/manifest.json'))['version']; assert re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+',v); print(v)")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            python -c 'import pathlib,re,sys; parts=re.split(r"(?m)^## ([0-9]+[.][0-9]+[.][0-9]+)[^\n]*\n",pathlib.Path("RELEASE_NOTES.md").read_text()); notes=dict(zip(parts[1::2],parts[2::2])); print("## DEr Stromtarif "+sys.argv[1]+"\n"+notes[sys.argv[1]].strip())' "$VERSION" > /tmp/stromtarif-release-notes.md
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "DEr Stromtarif ${VERSION}" --notes-file /tmp/stromtarif-release-notes.md --latest
          fi
